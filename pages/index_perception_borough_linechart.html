<html lang="en">
<head>

    <title>Borough Perception Line Chart</title>

    <!-- Global styles -->
    <link rel="stylesheet" href="../css/style_base.css">
    <link rel="stylesheet" href="../css/navbar.css">

<select id="perception-metric-select">
    <option value="Good job">Good job</option>
    <option value="Trust MPS">Trust MPS</option>
    <option value="Fair treatment">Fair treatment</option>
</select>

<div id="tooltip" class="tooltip"></div>

<div id="chart-wrapper">

    <button id="resetZoomBtn">Reset Zoom</button>
</div>
<!-- Legend container -->
<div id="perception-borough-legend" class="legend-scroll"></div>
<!-- hoverList of Boroughs container -->
<div id="perception-borough-hoverlist"></div>

<!-- Chart logic -->
<script type="module">
    import { drawPerceptionBoroughChart } from "../js/perception_borough_linechart.js";
